name: review-relay

# A review doesn't trigger pull_request_target, and pull_request_review runs without the `checks`
# environment, so this only marks the moment: its completion starts gate.yml through workflow_run,
# from the default branch, to judge the PR again once the owner approves or a review is dismissed.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "A review changed; gate judges the PR again."
