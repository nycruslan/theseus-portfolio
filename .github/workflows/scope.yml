name: scope

# Fails a PR that touches the owner's paths, changes package.json's scripts or weakens tests (see
# .studio/scope.mjs), unless the owner labelled it owner-approved. `edited` covers a PR retargeted
# to another base, which changes what it is compared with. pull_request_target runs this file and the checker as they are
# on the base branch, so a PR can't edit away the check that judges it. Never check out, install or
# run the PR's code here: this event's token can write to the repository.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# No concurrency group, on purpose. A push followed seconds later by a label or a body edit runs
# scope twice on the same commit; a group would cancel one of them (with cancel-in-progress, or by
# replacing a pending run without it), and GitHub keeps that cancelled run on the commit beside the
# newer one. A run takes seconds and only reads, so letting each one finish costs nothing, and each
# judges the labels its own event carried. The merge gate counts only the latest run per check.

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      # Name git's default branch before checkout runs `git init`, which otherwise prints a hint.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .studio
      # Reads the PR's changed files and package.json's scripts through the API, and its labels
      # from the event.
      - run: node .studio/scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
