name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the run on its older head, so that run stops. Pushes to main
# all finish. A cancelled run sits on the old commit only, so it never blocks the new head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A typical run takes under two minutes; a hung one shouldn't hold a runner for six hours.
    timeout-minutes: 15
    steps:
      # Name git's default branch before checkout runs `git init`, which otherwise prints a hint.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      # Installs pnpm (version from packageManager) and Node, then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # The gate builders run before they finish: lint (biome ci) -> typecheck -> knip -> build,
      # stopping at the first failure. Biome annotates the diff when it runs in Actions. No
      # .next/cache is restored: a restored Turbopack cache once served a stale globals.css, so
      # next.config.ts turns that cache off and each build starts clean, in seconds.
      - run: pnpm verify
      # The team's harness: hooks for the broadcast, the write guard, verdicts and the merge gate.
      - run: pnpm test:harness
      # Browsers are cached per Playwright version; their system libraries are installed each run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The end-to-end checks with axe, served by `next start` from the build `pnpm verify` just
      # made in this job, so the site is built once per run.
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
