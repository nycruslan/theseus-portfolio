name: CI

# Actions are pinned to full commit SHAs, as in gate.yml and lens.yml, with the release in a
# trailing comment. Renovate (renovate.json) keeps the pins current once the owner installs its app.

on:
  pull_request:
    # `edited` covers a PR retargeted to another base: `check` must pass against the base it merges
    # into. A body edit re-runs it too, which costs minutes, not correctness.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# On a PR, the group is the PR's ref: a newer push cancels the run on the older head, running or
# waiting. That cancelled run sits on the old commit only, so it never blocks the new head. On a
# push to main, the group is the commit itself, so no two pushes share a group and every push's
# run finishes; a group shared across pushes would cancel a waiting run even without
# cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # About a minute and a half; 10 stops a hung run long before GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      # Name git's default branch before checkout runs `git init`, which otherwise prints a hint.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs pnpm (version from packageManager) and Node, then runs a frozen install.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # The gate builders run before they finish: lint (biome ci) -> typecheck -> knip -> build,
      # stopping at the first failure. Biome annotates the diff when it runs in Actions. No
      # .next/cache is restored: a restored Turbopack cache once served a stale globals.css, so
      # next.config.ts turns that cache off and each build starts clean, in seconds.
      - run: pnpm verify
      # The team's harness: the gate and lens checks, merge.mjs, the hooks and the broadcast.
      - run: pnpm test:harness

  # The end-to-end checks with axe, split by Playwright into four shards that run side by side. In
  # one job they took 32 of its 35 minutes by sprint 50 (#114), and every spec a sprint adds made
  # the crew wait longer for `check`. Each shard builds the site itself, in seconds, rather than
  # downloading a build from another job.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A shard takes about a quarter of the suite, 8 to 10 minutes; 20 leaves room for a slow runner.
    timeout-minutes: 20
    strategy:
      # Every shard finishes, so one run reports every failing spec, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm build
      # Browsers are cached per Playwright version; their system libraries are installed each run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Served by `next start` from the build this job just made.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The check the `protect-main` ruleset requires, by this name. It passes only when `verify` and
  # every shard passed. `always()` makes it report even when a job above failed or the run was
  # cancelled; under `!cancelled()` it would be skipped instead, and GitHub counts a skipped
  # required check as passing.
  check:
    if: always()
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$VERIFY" = success && test "$E2E" = success
        env:
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
