name: review-relay

# A review doesn't trigger pull_request_target, and pull_request_review runs without the `checks`
# environment, so this only marks the moment: its completion starts gate.yml through workflow_run,
# from the default branch, to judge the PR again once the owner approves or their review is
# dismissed. Only the owner's approvals and changes requested release or hold the gate, so other
# reviews skip the job: Lens's, posted by the checks app on every run, and the comment-only
# reviews GitHub records when a session, acting as the owner, replies to a review thread. gate.yml
# ignores a skipped relay.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    if: >-
      github.event.review.user.login == github.repository_owner &&
      github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "A review changed; gate judges the PR again."
