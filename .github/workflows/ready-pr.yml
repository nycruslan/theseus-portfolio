name: ready-pr

# Marks a team pull request ready for review, as the team's checks app, once its sprint's
# close-out is pushed. open-pr.yml opens each one as a draft, so nobody merges it while the team
# still works on it: on 2026-10-20 #43 was merged seconds before its close-out landed. REST can't
# mark a draft ready and cloud sessions can't reach GraphQL, so `.crew/ready-pr.mjs` asks for
# this run, which can.
#
# workflow_dispatch runs this file from the ref it's given, but the `checks` environment, which
# holds the app key, serves the default branch alone. The number reaches the step through env.
#
# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment, as in
# the other workflows.
on:
  workflow_dispatch:
    inputs:
      number:
        description: The pull request to mark ready for review
        required: true
        type: number

permissions: {}

jobs:
  ready-pr:
    runs-on: ubuntu-latest
    environment: checks
    timeout-minutes: 2
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
        run: gh pr ready "$NUMBER" --repo "$REPO"
