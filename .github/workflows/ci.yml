name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Name git's default branch before checkout runs `git init`, which otherwise prints a hint.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      # Installs pnpm (version from packageManager) and Node, then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # Next.js reuses its build cache between runs: faster builds, and no "No build cache found".
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '**/*.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # The gate builders run before they finish: lint (biome ci) -> typecheck -> knip -> build,
      # stopping at the first failure. Biome annotates the diff when it runs in Actions.
      - run: pnpm verify
      # The team's harness: hooks for the broadcast, the write guard, verdicts and the merge gate.
      - run: pnpm test:harness
      # Browsers are cached per Playwright version; their system libraries are installed each run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Contract and smoke tests with axe, against a fresh `next build && next start`.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
